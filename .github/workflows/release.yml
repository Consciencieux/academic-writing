name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build dependencies
        run: python -m pip install -r requirements.txt
      - name: Match release to changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', tag):
              raise SystemExit('Expected vMAJOR.MINOR.PATCH[-prerelease]')
          marker = '## [' + tag[1:] + '] - '
          if not any(line.startswith(marker) for line in pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()):
              raise SystemExit('Missing matching dated changelog entry')
          PYCODE
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build verified packages
        run: python scripts/package_skills.py --output-dir dist
      - name: Publish exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS=(dist/academic-writing-guide.zip dist/academic-writing-audit.zip dist/academic-writing-skills.zip dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" --title "$RELEASE_TAG" --generate-notes
          fi
