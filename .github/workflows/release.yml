name: Release

# 推送 v* 标签后，从仓库唯一的 shared/rules/ 权威源生成安装包。
# 单 Skill ZIP 只有一层 Skill 目录；合集 ZIP 包含三个并列 Skill 目录。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: 检查版本与技能资源
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ "$VERSION" = "$RELEASE_TAG" ]; then
            echo "ERROR: 只接受 v 前缀标签" >&2
            exit 1
          fi
          if ! grep -qF "## [${VERSION}] - " CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md 缺少版本 ${VERSION} 的正式条目" >&2
            exit 1
          fi
          python3 scripts/package_skills.py --check-only

      - name: 打包独立 Skills 与合集
        run: |
          set -euo pipefail
          python3 scripts/package_skills.py --output-dir dist
          (cd dist && sha256sum *.zip > SHA256SUMS)
          echo '发布产物：'
          ls -lh dist/*.zip dist/SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
              --title "$RELEASE_TAG" --generate-notes
          fi
