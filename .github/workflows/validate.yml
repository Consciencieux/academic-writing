name: Validate Skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Syntax
        run: python -m py_compile scripts/package_skills.py scripts/lint_tex.py
      - name: Deterministic regression tests
        run: python -m unittest discover -s tests -v
      - name: Source contract and links
        run: python scripts/package_skills.py --check-only
      - name: Self-contained installed packages
        run: python scripts/package_skills.py --output-dir dist
