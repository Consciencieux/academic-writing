name: Validate Skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/package_skills.py scripts/lint_tex.py scripts/lint_text.py scripts/language_checks.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Resources and links
        run: python scripts/package_skills.py --check-only
      - name: Build skill packages
        run: python scripts/package_skills.py --output-dir dist
